name: Kimpton AI
description: >-
  Kimpton AI is an AI-native investment research platform for institutional
  portfolio managers at hedge funds, mutual funds, and sustainable equity funds.
  It ingests market data, SEC filings, 13F holdings, earnings, and a fund's own
  investment mandates and research documents, then generates daily trade
  proposals with citations grounded in the fund's actual holdings — keeping human
  managers in control of every final decision. The platform connects to
  custodians and OMS/portfolio systems (or accepts direct uploads) to sync
  positions and P&L, aggregates mandates and research in a document vault, and
  integrates market-data partners FactSet, Tiingo, Massive, and Plaid. It is a
  managed service for professional investors and does not currently expose a
  public developer API. Backed by Y Combinator.
